[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inkagree"
version = "0.2.2"
description = "Which of two ink renders agrees better with villa's published ink labels? Exact AP/AUC on the label frame, alignment gate, paired block bootstrap."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "tifffile>=2023.1", "imagecodecs>=2023.1", "tensorstore>=0.1.60"]  # imagecodecs: vc_render_tifxyz writes LZW TIFFs

[project.optional-dependencies]
test = ["pytest", "scikit-learn"]

[project.scripts]
inkagree = "inkagree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
